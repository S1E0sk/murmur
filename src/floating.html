<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      -webkit-app-region: drag;
      overflow: hidden;
      user-select: none;
    }
    .panel {
      margin: 8px;
      background: rgba(22, 22, 26, 0.96);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      height: 66px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .mic-wrap {
      width: 36px; height: 36px;
      background: rgba(255,55,95,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .mic-wrap svg { width: 18px; height: 18px; fill: #FF375F; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #30D158; flex-shrink: 0;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .wave {
      display: flex; align-items: center;
      gap: 3px; flex: 1; height: 36px;
    }
    .bar {
      width: 3px; min-height: 3px; border-radius: 2px;
      background: linear-gradient(to top, #FF375F, #FF8FAB);
      transition: height 0.07s ease-out;
    }
    .live-text {
      color: rgba(255,255,255,0.65);
      font-size: 12.5px;
      max-width: 110px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .live-text.error { color: #FF453A; }
    .cancel {
      -webkit-app-region: no-drag;
      background: rgba(255,255,255,0.07);
      border: none; color: rgba(255,255,255,0.45);
      font-size: 12px; width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    .cancel:hover { background: rgba(255,69,58,0.25); color: #FF453A; }
  </style>
</head>
<body>
<div class="panel">
  <div class="mic-wrap">
    <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm6.5 10.5A6.5 6.5 0 0 1 12 18a6.5 6.5 0 0 1-6.5-6.5H4A8 8 0 0 0 11 19.9V22h2v-2.1A8 8 0 0 0 20 11.5h-1.5z"/></svg>
  </div>
  <div class="dot"></div>
  <div class="wave" id="wave"></div>
  <span class="live-text" id="liveText">Dinliyorum...</span>
  <button class="cancel" id="cancelBtn">✕</button>
</div>

<script>
const { ipcRenderer } = require('electron')

// ─── Barları oluştur ─────────────────────────────────────────────────────────
const waveEl   = document.getElementById('wave')
const liveText = document.getElementById('liveText')
const cancelBtn = document.getElementById('cancelBtn')

const BAR_COUNT = 14
const bars = []
for (let i = 0; i < BAR_COUNT; i++) {
  const b = document.createElement('div')
  b.className = 'bar'
  b.style.height = '4px'
  waveEl.appendChild(b)
  bars.push(b)
}

// ─── Web Audio — mikrofon seviyesi görselleştirme ─────────────────────────────
let audioCtx, analyser, dataArray, animFrame, micStream

navigator.mediaDevices.getUserMedia({ audio: true, video: false })
  .then(stream => {
    micStream = stream
    audioCtx  = new AudioContext()
    analyser  = audioCtx.createAnalyser()
    analyser.fftSize = 64
    audioCtx.createMediaStreamSource(stream).connect(analyser)
    dataArray = new Uint8Array(analyser.frequencyBinCount)
    drawBars()
  })
  .catch(() => {
    // İzin yoksa simüle et
    simulateWave()
  })

function drawBars() {
  animFrame = requestAnimationFrame(drawBars)
  analyser.getByteFrequencyData(dataArray)
  const step = Math.floor(dataArray.length / BAR_COUNT)
  for (let i = 0; i < BAR_COUNT; i++) {
    const h = 4 + ((dataArray[i * step] || 0) / 255) * 32
    bars[i].style.height = h + 'px'
  }
}

// Mikrofon izni yoksa güzel simülasyon
function simulateWave() {
  let t = 0
  const tick = () => {
    t += 0.08
    for (let i = 0; i < BAR_COUNT; i++) {
      const h = 4 + Math.abs(Math.sin(t + i * 0.4)) * 28
      bars[i].style.height = h + 'px'
    }
    animFrame = requestAnimationFrame(tick)
  }
  animFrame = requestAnimationFrame(tick)
}

function cleanup() {
  if (animFrame) cancelAnimationFrame(animFrame)
  if (audioCtx) audioCtx.close().catch(() => {})
  if (micStream) micStream.getTracks().forEach(t => t.stop())
}

// ─── Swift'ten gelen mesajlar ─────────────────────────────────────────────────

ipcRenderer.on('interim-text', (_, text) => {
  liveText.classList.remove('error')
  liveText.textContent = text || 'Dinliyorum...'
})

ipcRenderer.on('show-error', (_, msg) => {
  liveText.classList.add('error')
  liveText.textContent = msg
  bars.forEach(b => b.style.height = '4px')
})

ipcRenderer.on('stop-recognition', () => {
  cleanup()
})

// ─── İptal ───────────────────────────────────────────────────────────────────
cancelBtn.addEventListener('click', () => {
  cleanup()
  ipcRenderer.send('dictation-cancel')
})

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cancelBtn.click()
})
</script>
</body>
</html>
