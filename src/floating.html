<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      -webkit-app-region: drag;
      overflow: hidden;
      user-select: none;
    }
    .panel {
      margin: 8px;
      background: rgba(22, 22, 26, 0.96);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      height: 66px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .mic-wrap {
      width: 36px; height: 36px;
      background: rgba(255,55,95,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .mic-wrap svg { width: 18px; height: 18px; fill: #FF375F; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #30D158; flex-shrink: 0;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .wave {
      display: flex; align-items: center;
      gap: 3px; flex: 1; height: 36px;
    }
    .bar {
      width: 3px; min-height: 3px; border-radius: 2px;
      background: linear-gradient(to top, #FF375F, #FF8FAB);
      transition: height 0.06s ease-out;
    }
    .live-text {
      color: rgba(255,255,255,0.75);
      font-size: 12.5px;
      max-width: 130px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .live-text.interim { color: rgba(255,255,255,0.45); font-style: italic; }
    .live-text.error   { color: #FF453A; }
    .cancel {
      -webkit-app-region: no-drag;
      background: rgba(255,255,255,0.07);
      border: none; color: rgba(255,255,255,0.45);
      font-size: 12px; width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    .cancel:hover { background: rgba(255,69,58,0.25); color: #FF453A; }
  </style>
</head>
<body>
<div class="panel">
  <div class="mic-wrap">
    <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm6.5 10.5A6.5 6.5 0 0 1 12 18a6.5 6.5 0 0 1-6.5-6.5H4A8 8 0 0 0 11 19.9V22h2v-2.1A8 8 0 0 0 20 11.5h-1.5z"/></svg>
  </div>
  <div class="dot"></div>
  <div class="wave" id="wave"></div>
  <span class="live-text" id="liveText">Dinliyorum...</span>
  <button class="cancel" id="cancelBtn">✕</button>
</div>

<script>
const { ipcRenderer } = require('electron')
const liveText  = document.getElementById('liveText')
const cancelBtn = document.getElementById('cancelBtn')
const waveEl    = document.getElementById('wave')

// ─── Ses dalgası barları ──────────────────────────────────────────────────────
const BAR_COUNT = 14
const bars = []
for (let i = 0; i < BAR_COUNT; i++) {
  const b = document.createElement('div')
  b.className = 'bar'
  b.style.height = '4px'
  waveEl.appendChild(b)
  bars.push(b)
}

let audioCtx, analyser, dataArray, animFrame, micStream
let socket = null
let mediaRecorder = null
let isActive = true

// ─── Başlat ───────────────────────────────────────────────────────────────────
ipcRenderer.invoke('get-settings').then(settings => {
  const lang      = settings.language === 'en' ? 'en-US' : 'tr'
  const deepgramKey = settings.deepgramApiKey || ''

  if (!deepgramKey) {
    showError('Deepgram API key yok')
    setTimeout(() => ipcRenderer.send('dictation-cancel'), 2000)
    return
  }

  // Mikrofon aç
  navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    .then(stream => {
      micStream = stream
      setupVisualizer(stream)
      startDeepgramStreaming(stream, deepgramKey, lang)
    })
    .catch(() => {
      showError('Mikrofon izni gerekli')
      setTimeout(() => ipcRenderer.send('dictation-cancel'), 2000)
    })
})

// ─── Deepgram WebSocket Streaming ─────────────────────────────────────────────
function startDeepgramStreaming(stream, apiKey, lang) {
  const params = new URLSearchParams({
    language:          lang,
    model:             'nova-2',     // en iyi model
    punctuate:         'true',
    interim_results:   'true',       // konuşurken göster
    smart_format:      'true',       // otomatik noktalama
    utterance_end_ms:  '1500',       // 1.5sn sessizlik = cümle bitti
    vad_events:        'true',       // ses aktivasyon olayları
    endpointing:       '400',        // 400ms sessizlikte gönder
  })

  socket = new WebSocket(`wss://api.deepgram.com/v1/listen?${params}`, [
    'token', apiKey
  ])

  socket.onopen = () => {
    // MediaRecorder ile ses parçalarını WebSocket'e gönder
    mediaRecorder = new MediaRecorder(stream, {
      mimeType: 'audio/webm;codecs=opus',
      audioBitsPerSecond: 16000
    })

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0 && socket.readyState === WebSocket.OPEN) {
        socket.send(e.data)
      }
    }

    mediaRecorder.start(100)   // her 100ms'de bir parça gönder → gerçek zamanlı
  }

  socket.onmessage = (e) => {
    const data = JSON.parse(e.data)

    if (data.type === 'Results') {
      const alt      = data.channel?.alternatives?.[0]
      const text     = alt?.transcript?.trim()
      const isFinal  = data.is_final

      if (!text) return

      if (isFinal) {
        // Kesin sonuç → anında yaz
        liveText.classList.remove('interim')
        liveText.textContent = text
        ipcRenderer.send('stream-text', text + ' ')
      } else {
        // Ara sonuç → panelde göster ama yazma
        liveText.classList.add('interim')
        liveText.textContent = text
      }
    }

    if (data.type === 'UtteranceEnd') {
      // Kullanıcı durdu sinyali
      liveText.classList.remove('interim')
      liveText.textContent = 'Dinliyorum...'
    }
  }

  socket.onerror = (e) => {
    showError('Bağlantı hatası')
    setTimeout(() => ipcRenderer.send('dictation-cancel'), 2000)
  }

  socket.onclose = (e) => {
    if (isActive && e.code !== 1000) {
      showError(`Hata: ${e.code}`)
    }
  }
}

// ─── Ses görselleştirme ───────────────────────────────────────────────────────
function setupVisualizer(stream) {
  audioCtx  = new AudioContext()
  analyser  = audioCtx.createAnalyser()
  analyser.fftSize = 64
  audioCtx.createMediaStreamSource(stream).connect(analyser)
  dataArray = new Uint8Array(analyser.frequencyBinCount)
  drawBars()
}

function drawBars() {
  animFrame = requestAnimationFrame(drawBars)
  if (!analyser) return
  analyser.getByteFrequencyData(dataArray)
  const step = Math.floor(dataArray.length / BAR_COUNT)
  for (let i = 0; i < BAR_COUNT; i++) {
    const h = 4 + ((dataArray[i * step] || 0) / 255) * 32
    bars[i].style.height = h + 'px'
  }
}

// ─── Temizlik ─────────────────────────────────────────────────────────────────
function cleanup() {
  isActive = false
  if (animFrame) cancelAnimationFrame(animFrame)
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop()
  if (socket && socket.readyState === WebSocket.OPEN) socket.close(1000)
  if (audioCtx) audioCtx.close().catch(() => {})
  if (micStream) micStream.getTracks().forEach(t => t.stop())
}

function showError(msg) {
  liveText.classList.add('error')
  liveText.classList.remove('interim')
  liveText.textContent = msg
  bars.forEach(b => b.style.height = '4px')
}

// ─── Kontroller ───────────────────────────────────────────────────────────────
cancelBtn.addEventListener('click', () => {
  cleanup()
  ipcRenderer.send('dictation-cancel')
})

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cancelBtn.click()
})

ipcRenderer.on('stop-recognition', () => cleanup())
</script>
</body>
</html>
